<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Review Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
    <style>
        .spinner {
            border-top-color: #3498db;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <main class="container mx-auto max-w-4xl p-4 sm:p-8">

        <header class="mb-8 text-center">
            <h1 class="text-4xl font-bold text-gray-800">Movie Review Analyzer</h1>
            <p class="mt-2 text-gray-600">Enter a movie title to see how audiences feel about it, based on TMDb reviews.</p>
        </header>

        <section class="rounded-lg bg-white p-6 shadow-md">
            <form id="search-form" class="flex flex-col gap-4 sm:flex-row">
                <input
                    type="text"
                    id="movie-title-input"
                    placeholder="e.g. Inception"
                    aria-label="Movie title"
                    class="flex-grow rounded-md border border-gray-300 p-3 transition focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                <button
                    type="submit"
                    id="analyze-btn"
                    class="rounded-md bg-blue-600 px-6 py-3 font-bold text-white transition duration-300 hover:bg-blue-700"
                >Analyze Reviews</button>
            </form>
        </section>

        <section id="results-section" class="mt-8 hidden rounded-lg bg-white p-6 shadow-md">
            <div id="loader" class="my-8 hidden text-center">
                <div class="spinner mx-auto h-24 w-24 rounded-full border-8 border-gray-200 border-t-8 ease-linear"></div>
                <p class="mt-4 text-gray-600">Fetching reviews and analyzing...</p>
            </div>

            <div id="error-message" role="alert" class="my-8 hidden rounded-md bg-red-100 p-4 text-center text-red-700"></div>

            <div id="summary" class="hidden text-center">
                <h2 class="mb-4 text-2xl font-bold text-gray-800">Analysis Complete</h2>
                <div class="mx-auto max-w-xs"><canvas id="sentiment-chart"></canvas></div>
                <p id="summary-text" class="mt-4 text-gray-700"></p>
            </div>

            <div id="details" class="mt-8 hidden">
                <h3 class="mb-4 text-xl font-semibold text-gray-800">Reviews</h3>
                <div id="reviews-container" class="max-h-96 space-y-4 overflow-y-auto pr-4"></div>
            </div>
        </section>
    </main>

    <script>
        const form = document.getElementById('search-form');
        const movieTitleInput = document.getElementById('movie-title-input');
        const analyzeBtn = document.getElementById('analyze-btn');
        const resultsSection = document.getElementById('results-section');
        const loader = document.getElementById('loader');
        const errorMessage = document.getElementById('error-message');
        const summary = document.getElementById('summary');
        const details = document.getElementById('details');
        const reviewsContainer = document.getElementById('reviews-container');
        const summaryText = document.getElementById('summary-text');
        const chartCanvas = document.getElementById('sentiment-chart');
        let sentimentChart = null;

        function showOnly(...visible) {
            for (const el of [loader, errorMessage, summary, details]) {
                el.classList.toggle('hidden', !visible.includes(el));
            }
        }

        function renderResults(data) {
            summaryText.textContent =
                `Analyzed ${data.total_reviews} reviews: ${data.positive_count} positive and ${data.negative_count} negative.`;

            if (sentimentChart) sentimentChart.destroy();
            sentimentChart = new Chart(chartCanvas, {
                type: 'pie',
                data: {
                    labels: ['Positive', 'Negative'],
                    datasets: [{
                        data: [data.positive_count, data.negative_count],
                        backgroundColor: ['#22c55e', '#ef4444'],
                        hoverOffset: 4,
                    }],
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'top' },
                        title: { display: true, text: 'Sentiment Distribution' },
                    },
                },
            });

            reviewsContainer.replaceChildren(...data.reviews.map(review => {
                const item = document.createElement('div');
                const border = review.sentiment === 'Positive' ? 'border-green-500' : 'border-red-500';
                item.className = `rounded-md border-l-4 bg-gray-50 p-4 ${border}`;
                item.textContent = review.text;
                return item;
            }));
        }

        async function analyze(event) {
            event.preventDefault();
            const movieTitle = movieTitleInput.value.trim();

            resultsSection.classList.remove('hidden');
            if (!movieTitle) {
                showOnly(errorMessage);
                errorMessage.textContent = 'Please enter a movie title.';
                return;
            }

            analyzeBtn.disabled = true;
            showOnly(loader);

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ movie_title: movieTitle }),
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'An unknown error occurred.');

                // Show the canvas before drawing so Chart.js sizes it correctly.
                showOnly(summary, details);
                renderResults(data);
            } catch (error) {
                errorMessage.textContent = `Error: ${error.message}`;
                showOnly(errorMessage);
            } finally {
                analyzeBtn.disabled = false;
            }
        }

        form.addEventListener('submit', analyze);
    </script>
</body>
</html>
